<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyJoust — Host Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/style.css">
<style>
  body{ display:flex; align-items:center; justify-content:center; touch-action:auto; user-select:none; }
  #stage{ position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }

  /* ---------------- LOBBY ---------------- */
  #lobby{
    display:flex; flex-direction:column; align-items:center; gap:22px;
    text-align:center; padding:30px;
  }
  #room-code{
    font-family:'Press Start 2P'; font-size:64px; color:var(--torch-glow);
    letter-spacing:14px; text-shadow:4px 4px 0 var(--lava);
  }
  #join-instructions{ color:var(--stone-lt); font-weight:600; font-size:15px; }
  #join-urls{ font-family:'Press Start 2P'; font-size:13px; color:var(--parch); line-height:2; }
  #qr-wrap{ background:#fff; padding:10px; border-radius:10px; display:none; }
  #qr-wrap.show{ display:block; }
  #qr-img{ width:150px; height:150px; display:block; }

  #player-grid{
    display:flex; flex-wrap:wrap; gap:14px; justify-content:center; max-width:800px; min-height:70px;
  }
  .player-chip{
    display:flex; align-items:center; gap:8px;
    background:rgba(74,78,105,0.4); border:2px solid var(--stone);
    border-radius:30px; padding:8px 16px 8px 8px;
    font-weight:800; font-size:14px;
    animation: pop-in 0.25s ease;
  }
  @keyframes pop-in{ from{ transform:scale(0.6); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .player-chip .dot{ width:22px; height:22px; border-radius:50%; }

  #btn-start{ margin-top:6px; }
  #lobby-hint{ color:var(--stone-lt); font-size:13px; }

  /* ---------------- COUNTDOWN ---------------- */
  #countdown{
    font-family:'Press Start 2P'; font-size:120px; color:var(--torch-glow);
    text-shadow:5px 5px 0 var(--lava);
  }

  /* ---------------- GAME ---------------- */
  #canvas-wrap{ position:relative; }
  canvas{ display:block; box-shadow:0 0 0 3px var(--stone), 0 0 80px rgba(255,122,61,0.15); border-radius:2px; }
  #game-hud{
    position:absolute; top:10px; left:10px; right:10px;
    display:flex; justify-content:space-between;
    font-family:'Press Start 2P'; font-size:12px;
    pointer-events:none;
  }
  #scoreboard{ display:flex; gap:16px; flex-wrap:wrap; }
  .sb-entry{ display:flex; align-items:center; gap:6px; text-shadow:2px 2px 0 rgba(0,0,0,0.6); }
  .sb-entry .dot{ width:10px; height:10px; border-radius:50%; }
  .sb-entry.dead{ opacity:0.35; text-decoration:line-through; }
  #bpm-tag{ color:var(--torch-glow); text-shadow:2px 2px 0 rgba(0,0,0,0.6); }

  /* ---------------- RESULTS ---------------- */
  #results{ display:flex; flex-direction:column; align-items:center; gap:18px; text-align:center; }
  #results-list{ display:flex; flex-direction:column; gap:10px; min-width:320px; }
  .result-row{
    display:flex; align-items:center; gap:12px;
    background:rgba(74,78,105,0.35); border:2px solid var(--stone);
    border-radius:10px; padding:10px 16px; font-weight:800;
  }
  .result-row .rank{ font-family:'Press Start 2P'; color:var(--torch-glow); width:36px; }
  .result-row .dot{ width:18px; height:18px; border-radius:50%; }
  .result-row .name{ flex:1; text-align:left; }
</style>
</head>
<body>
<div id="stage">

  <div id="lobby" class="panel active">
    <div class="brand-title">SKYJOUST</div>
    <div id="room-code">----</div>
    <div id="join-instructions">Grab your phone and join the joust</div>
    <div id="join-urls">Loading network info…</div>
    <div id="qr-wrap"><img id="qr-img" alt="QR code to join"></div>
    <div id="player-grid"></div>
    <div id="lobby-hint">Waiting for riders to join…</div>
    <button id="btn-start" class="btn-primary" disabled>START JOUST</button>
  </div>

  <div id="countdown-wrap" class="panel" style="display:none;">
    <div id="countdown">3</div>
  </div>

  <div id="canvas-wrap" class="panel" style="display:none;">
    <canvas id="game" width="900" height="560"></canvas>
    <div id="game-hud">
      <div id="scoreboard"></div>
      <div id="bpm-tag">128 BPM</div>
    </div>
  </div>

  <div id="results" class="panel" style="display:none;">
    <div class="brand-title" style="font-size:26px;">RESULTS</div>
    <div id="results-list"></div>
    <button id="btn-again" class="btn-primary">PLAY AGAIN</button>
  </div>

</div>
<script src="/host.js"></script>
</body>
</html>
